services:
  - type: web
    name: credit-risk-ai
    runtime: python
    plan: free
    buildCommand: uv sync --frozen --no-dev
    startCommand: cd src && uv run uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13